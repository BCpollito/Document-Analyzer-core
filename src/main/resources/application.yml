
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/analizador}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:contr123}
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 9090

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}

ai-service:
  url: ${AI_SERVICE_URL:${AI_SERVICE_BASE_URL:http://ai-service:8000}}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: PT60M

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
