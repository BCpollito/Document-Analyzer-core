
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: document-analyzer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analizador}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./ai-service
    container_name: document-analyzer-ai
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-analizador}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: document-analyzer-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-analizador}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      FILE_STORAGE_PATH: /app/storage
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT60M}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-9090}:9090"
    volumes:
      - uploaded_files:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

volumes:
  postgres_data:
  uploaded_files:
